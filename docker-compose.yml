version: "3.8"

services:
  db:
    image: postgres:13
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"

  backend:
    build:
      context: ./feelreal-backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://db:${DB_PORT}/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GPT_API_KEY: ${GPT_API_KEY}
      GPT_API_URL: ${GPT_API_URL}
    ports:
      - "${BE_PORT}:${BE_PORT}"
    depends_on:
      - db

  frontend:
    build:
      context: ./feelreal-frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "${FE_PORT}:${FE_PORT}"
    depends_on:
      - backend

volumes:
  pgdata:
